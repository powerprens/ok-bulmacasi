<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amaze GO!">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Amaze GO! — Çizgi & Labirent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="hdr-side">
        <button id="btnSound" class="icon-btn" title="Sesi aç/kapat">🔊</button>
      </div>
      <div id="levelPill">LEVEL <span id="levelNum">1</span><span id="lives" title="Yanma hakkı"></span></div>
      <div class="hdr-side right">
        <button id="btnRestart" class="icon-btn" title="Seviyeyi yeniden başlat">↻</button>
        <button id="btnHelp" class="icon-btn" title="Nasıl oynanır?">?</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="game"></canvas>
    </main>

    <footer><span id="hint">Sürükle: noktaları sırayla birleştir</span></footer>

    <div id="overlay" class="hidden">
      <div class="panel" id="overlayPanel"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
